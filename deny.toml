# Policy of `mise run audit`. cargo-deny checks what the workspace depends on;
# `cargo audit` reads the same RustSec database from Cargo.lock alone.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
# Permissive licenses only: the crates are MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
