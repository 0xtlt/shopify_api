# Policy of `mise run audit`: RustSec advisories, licenses and sources of
# what the workspace depends on.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
# Permissive licenses only: the crates are MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
