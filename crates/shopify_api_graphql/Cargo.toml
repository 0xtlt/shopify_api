[package]
name = "shopify_api_graphql"
description = "Checks Shopify Admin GraphQL operations against the schema and generates their Rust types. Used by the `graphql!` macro of `shopify_api`."
documentation = "https://docs.rs/shopify_api_graphql"
keywords = ["shopify", "graphql", "codegen"]
categories = ["development-tools", "api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
graphql-parser.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { workspace = true, optional = true }

[features]
## `project::download_public_schema`, `project::download_schema_file` and `project::up_to_date_schema`.
download = ["dep:ureq"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
