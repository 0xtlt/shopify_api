[workspace]
resolver = "3"
members = [
  "crates/shopify_api",
  "crates/shopify_api_graphql",
  "crates/shopify_api_macros",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/0xtlt/shopify_api"
authors = ["Thomas Tastet"]

[workspace.dependencies]
# The three crates are released together: each one requires the exact
# version of the others, since the macro emits code for that runtime.
shopify_api = { path = "crates/shopify_api", version = "=1.0.0" }
shopify_api_graphql = { path = "crates/shopify_api_graphql", version = "=1.0.0" }
shopify_api_macros = { path = "crates/shopify_api_macros", version = "=1.0.0" }

base64 = "0.23"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-core = { version = "0.3.31", default-features = false }
graphql-parser = "0.4"
hex = "0.4"
hmac = "0.13"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
syn = { version = "3", features = ["full"] }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "display"] }
trybuild = "1"
ureq = "3.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mod_module_files = "deny"
