name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - check
      - features
      - msrv
    steps:
      - run: exit 0

  check:
    name: fmt, clippy, tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  # In its own job, so the build of nothing else can lend the client a
  # feature it does not declare (`mise run check` runs it too).
  features:
    name: no default features, each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      # `cargo check -p shopify_api --no-default-features --lib --locked`, then each feature alone.
      - run: mise run check:features

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked
