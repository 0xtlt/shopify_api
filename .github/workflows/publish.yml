name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - call-ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The three crates at once, in dependency order: when one fails to
      # build, none is published.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
