name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - call-ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # In dependency order: the schema and checker, the macro, then the client.
      - run: cargo publish --locked -p shopify_api_graphql
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - run: cargo publish --locked -p shopify_api_macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - run: cargo publish --locked -p shopify_api
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
